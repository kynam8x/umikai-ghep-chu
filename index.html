<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ghép chữ Đại sứ Umikai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  /* Bảng màu lấy từ logo Siêu Thị Vietwise: cam bàn tay, xám "phúc lộc của con" */
  :root {
    --or: #F26A21; --or-deep: #C94E14; --or-soft: #FDE6D8; --or-wash: #FFF4EC;
    --grey: #6D6E71; --ink: #2B2420; --paper: #FFFAF6; --line: #F0DDD0;
    --gold: #F4B63A; --gold-deep: #B7801A; --gold-soft: #FFF1CF;
    --white: #FFFFFF;
    --r: 14px;
    --display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
    --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [hidden] { display: none !important; } /* trang đăng độc lập (GitHub Pages, Apps Script) không có sẵn quy tắc này như Artifact */
  html, body { background: var(--paper); color: var(--ink); margin: 0; }
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: var(--body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 120px; }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
  h2 { font-size: 22px; } h3 { font-size: 17px; }
  p { margin: 0; }
  .muted { color: var(--grey); }
  .small { font-size: 13px; }
  .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--or-deep); }

  header.top { display: flex; align-items: center; gap: 12px; padding-block: 14px 4px; }
  header.top img { height: 40px; width: auto; }
  header.top .t { display: flex; flex-direction: column; }
  header.top .t b { font-family: var(--display); font-size: 20px; line-height: 1; color: var(--ink); }
  header.top .t span { font-size: 12px; color: var(--grey); }
  header.top button { margin-left: auto; }

  .card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .hero { background: var(--or); color: var(--white); border: 0; }
  .hero .eyebrow { color: #FFE2CF; }
  .hero .muted { color: #FFE2CF; }

  /* Ô chữ kiểu quân cờ chữ */
  .tiles { display: flex; flex-wrap: wrap; gap: 6px; }
  .tile { --s: 40px; width: var(--s); height: var(--s); border-radius: 9px; display: grid; place-items: center; position: relative;
    font-family: var(--display); font-weight: 800; font-size: calc(var(--s) * .55); line-height: 1;
    background: var(--or); color: var(--white); box-shadow: 0 3px 0 var(--or-deep); }
  .tile.key { background: var(--gold); color: var(--ink); box-shadow: 0 3px 0 var(--gold-deep); }
  .tile.key::after { content: "🔑"; position: absolute; top: -7px; right: -6px; font-size: 12px; }
  .tile.star { background: var(--gold-soft); color: var(--gold-deep); box-shadow: 0 3px 0 var(--gold); }
  .tile.miss { background: transparent; color: #D9C4B6; box-shadow: none; border: 2px dashed #E6CFC0; }
  .tile.miss.key { border-color: var(--gold); color: #E4C27C; }
  .tile.miss.key::after { opacity: .5; }
  .tile .n { position: absolute; bottom: -6px; right: -6px; background: var(--ink); color: var(--white); font-family: var(--body);
    font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding-inline: 4px; }
  .tile.big { --s: 88px; border-radius: 16px; box-shadow: 0 5px 0 var(--or-deep); }
  .tile.big.key { box-shadow: 0 5px 0 var(--gold-deep); }
  .hero .tile { background: var(--white); color: var(--or); box-shadow: 0 5px 0 #F7B48E; }
  .hero .tile.key { background: var(--gold); color: var(--ink); box-shadow: 0 5px 0 var(--gold-deep); }

  button, .btn { font: 600 15px var(--body); border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; background: var(--or); color: var(--white); }
  button:disabled { background: #E9D9CE; color: #A08E82; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--or-deep); border: 1.5px solid var(--line); padding: 8px 12px; font-size: 13px; }
  .hero button { background: var(--white); color: var(--or-deep); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  input, select { font: 15px var(--body); padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--white); color: var(--ink); width: 100%; box-sizing: border-box; }
  label { font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
  label.check { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; }
  label.check input { width: auto; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 160px; }

  .dots { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; }
  .dot { aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.28); }
  .dot.on { background: var(--white); }
  .dot.today { outline: 2px solid var(--gold); outline-offset: 1px; }

  .word { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; padding-block: 14px; border-top: 1px solid var(--line); }
  .word:first-of-type { border-top: 0; padding-top: 0; }
  .word .meta { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--grey); flex-wrap: wrap; }
  .word .lv { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--ink); }
  .word .tile { --s: 32px; }
  .pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--or-soft); color: var(--or-deep); white-space: nowrap; }
  .pill.gold { background: var(--gold-soft); color: var(--gold-deep); }
  .pill.done { background: #E8E5E3; color: var(--grey); }

  .board { display: flex; flex-wrap: wrap; gap: 10px 14px; justify-content: center; }
  .board .w { display: flex; gap: 4px; }
  .board .tile { --s: 30px; }
  .bar { height: 12px; border-radius: 6px; background: var(--or-soft); position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--or); }
  .ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--grey); font-variant-numeric: tabular-nums; }

  .bagbar { padding: 12px 14px; gap: 8px; }
  .bagbar .tiles { flex-wrap: nowrap; overflow-x: auto; padding: 6px 4px 8px 0; scrollbar-width: none; }
  .bagbar .tile { --s: 36px; flex: 0 0 auto; }
  .daypick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .daypick button { background: rgba(255,255,255,.18); color: var(--white); border: 2px solid rgba(255,255,255,.5); border-radius: 12px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; font-size: 14px; line-height: 1.25; }
  .daypick button small { font-weight: 500; font-size: 12px; color: #FFE2CF; }
  .daypick button[aria-pressed="true"] { background: var(--white); color: var(--or-deep); border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold); }
  .daypick button[aria-pressed="true"]::before { content: "✓ Đang chọn"; font-size: 11px; font-weight: 700; color: var(--gold-deep); }
  .daypick button[aria-pressed="true"] small { color: var(--grey); }
  .bu-note { background: var(--gold-soft); color: var(--gold-deep); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
  .feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .feed li { display: flex; gap: 10px; }
  .feed time { color: var(--grey); font-size: 12px; min-width: 42px; font-variant-numeric: tabular-nums; padding-top: 2px; }

  ol.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
  ol.rules b { color: var(--or-deep); }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--white); border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(43,36,32,.08);
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
  nav.tabs button { background: transparent; color: var(--grey); border-radius: 14px; padding: 8px 1px 8px; min-height: 66px; font-size: 12px; line-height: 1.15; text-align: center; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  nav.tabs button b { font-size: 26px; line-height: 1; }
  nav.tabs button[aria-current="page"] { color: var(--or-deep); background: var(--or-soft); box-shadow: inset 0 -4px 0 var(--or); }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); max-width: 528px; margin: 0 auto;
    background: var(--ink); color: var(--white); padding: 12px 16px; border-radius: 12px; font-size: 14px; z-index: 9; }
  .modal { position: fixed; inset: 0; background: rgba(43,36,32,.55); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .modal .card { max-width: 380px; width: 100%; align-items: center; text-align: center; }
  .flip { animation: flip .7s cubic-bezier(.2,.8,.3,1.2); }
  @keyframes flip { from { transform: rotateY(90deg) scale(.6); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .flip { animation: none; } }
  /* Chọn 1 trong 2 chữ (check-in đúng giờ): làm thật nổi để không ai bỏ qua */
  .hero.needpick { box-shadow: 0 0 0 4px var(--gold); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(244,182,58,.45); } }
  .pickrow { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .pickopt { display: flex; flex-direction: column; align-items: center; gap: 10px; background: transparent; padding: 4px; }
  .pickopt .go { background: var(--gold); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 700; box-shadow: 0 3px 0 var(--gold-deep); }
  .pickhead { font-family: var(--display); font-size: 22px; line-height: 1.2; text-align: center; margin: 0; }
  .pickfoot { font-size: 13px; text-align: center; color: #FFE2CF; }
  .modal .pickhead { color: var(--ink); }
  .modal .pickfoot { color: var(--grey); }
  .modal .pickopt .go { box-shadow: 0 3px 0 var(--gold-deep); }
  .pendbar { background: var(--gold); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-weight: 700; display: flex; gap: 10px; align-items: center; justify-content: space-between; box-shadow: 0 3px 0 var(--gold-deep); }
  .pendbar button { background: var(--ink); color: var(--white); padding: 8px 12px; font-size: 13px; white-space: nowrap; }
  nav.tabs button.alert { position: relative; }
  nav.tabs button.alert::after { content: ""; position: absolute; top: 6px; right: calc(50% - 26px); width: 14px; height: 14px; border-radius: 50%; background: #E23B2E; border: 2px solid var(--white); }
  @media (prefers-reduced-motion: reduce) { .hero.needpick { animation: none; } }
  /* Tab Thành quả nhóm (lớp riêng, 08/10) */
  .tqstats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tqstat { background: var(--or-wash); border-radius: 12px; padding: 10px 12px; }
  .hero .tqstat { background: rgba(255,255,255,.18); }
  .tqstat b { display: block; font-family: var(--display); font-size: 24px; line-height: 1.1; }
  .tqstat small { font-size: 12px; opacity: .85; }
  .tqbig { font-family: var(--display); font-size: 44px; line-height: 1; font-weight: 800; }
  .tqbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .tqb { border: 1.5px dashed var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; color: #B8A99C; display: flex; flex-direction: column; gap: 2px; align-items: center; }
  .tqb .e { font-size: 28px; filter: grayscale(1); opacity: .5; }
  .tqb b { font-size: 12px; line-height: 1.2; }
  .tqb small { font-size: 11px; }
  .tqb.on { border: 1.5px solid var(--gold); background: var(--gold-soft); color: var(--ink); }
  .tqb.on .e { filter: none; opacity: 1; }
  .tqlock { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: #EDE6FA; color: #5B3FA0; white-space: nowrap; }
  .tqpub { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: #E3F4E8; color: #1F7A3E; white-space: nowrap; }
  .tqform label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 14px; }
  .tqform input { font: 500 16px var(--body); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; background: var(--white); color: var(--ink); }
  .tqform small { font-weight: 500; color: var(--grey); font-size: 12px; }
  .tq2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tqsum { background: var(--or-wash); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  .tqlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .tqo { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .tqo .chip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--or-soft); color: var(--or-deep); }
  .tqo .chip.ok { background: #E3F4E8; color: #1F7A3E; }
  .tqwall { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .tqwall li { display: flex; gap: 10px; }
  .tqwall .heart { font-size: 20px; line-height: 1.2; }
  .cf { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 11; }
  .cf span { position: absolute; top: -30px; font-size: 26px; animation: cffall 2.6s ease-in forwards; }
  @keyframes cffall { to { transform: translateY(110vh) rotate(360deg); opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { .cf { display: none; } }
  .modal .bigemoji { font-size: 72px; line-height: 1; }
  .demo { background: var(--gold-soft); color: var(--gold-deep); border-radius: 12px; padding: 10px 12px; font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
</style>
</head>

  // Chữ hiếm 🔑: kho mỗi chữ = tổng (số suất × số lần xuất hiện) của các từ chứa nó → luôn đủ chữ cho mọi suất, không thừa nhiều.

  // Chuẩn hoá link Facebook để nhận ra cùng 1 bài dù dán kiểu khác nhau (bỏ ?mibextid…, bỏ / cuối, lấy id reel/video/post).
  // Link rút gọn /share/… mỗi lần bấm "Chia sẻ" có thể ra mã khác nhau nên chỉ chặn được khi dán y nguyên mã đó.

  var mem = null; // giữ tiến trình khi trình duyệt chặn localStorage
  function data() { if (mem) return mem; var d = store(K); if (!d || !d.ev) { d = seed(); store(K, d); } mem = d; return d; }
  return {
    players: players,
    handle: function (req) {
      var d = data(), now = at(d.day, 12 * 60 + 30); d.sales = d.sales || [];
      if (TQ.isAct(req.a)) {
        var t = TQ.act(req, d.sales, players, now, function () { return 'D' + Math.random().toString(36).slice(2, 9); });
        if (!t.res.ok) return t.res;
        d.sales = d.sales.concat(t.events);
        var s2 = GC.act({ a: 'state', ma: req.ma, pin: req.pin }, d.ev, players, now, Math.random);
        d.ev = d.ev.concat(s2.events); store(K, d); s2.res.last = t.res.last; return decorate(s2.res, d, now);
      }
      var r = GC.act(req, d.ev, players, now, Math.random);
      d.ev = d.ev.concat(r.events); store(K, d); return decorate(r.res, d, now);
    },
    nextDay: function () { var d = data(); matesDay(d.ev, d.day, Math.random); d.day = GC.addDays(d.day, 1); store(K, d); },
    reset: function () { mem = null; store(K, null); },
    day: function () { return data().day; }
  };
})();

function callOnce(req) {
  if (!ENDPOINT) return Promise.resolve(Demo.handle(req));
  if (ENDPOINT === 'GAS') return new Promise(function (ok) { // trang do chính Apps Script phục vụ (link /exec)
    google.script.run.withSuccessHandler(ok).withFailureHandler(function () { ok({ ok: false, net: true, error: 'Chưa kết nối được máy chủ game. Thử lại sau ít phút.' }); }).api(req);
  });
  return fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(req) }).then(function (r) { return r.json(); })
    .catch(function () { return { ok: false, net: true, error: 'Chưa kết nối được máy chủ game. Kiểm tra mạng rồi thử lại.' }; });
}
// Giờ cao điểm (12:12) máy chủ có thể báo "đông người" hoặc mạng chập chờn → tự thử lại tối đa 3 lần rồi mới báo lỗi
function call(req) {
  req.ma = S.creds.ma; req.pin = S.creds.pin;
  var tries = 0;
  function go() {
    return callOnce(req).then(function (res) {
      if (res && (res.busy || res.net) && ENDPOINT && tries < 3) {
        tries++; toast('Đang đông người, đang thử lại… (' + tries + '/3)');
        return new Promise(function (ok) { setTimeout(ok, 2500 * tries); }).then(go);
      }
      return res;
    });
  }
  return go();
}

function toast(msg) {

  clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 6000);
}

  document.getElementById('mOk').onclick = function () { m.hidden = true; };
}

function send(req, silent) {
  if (S.busy) return; S.busy = true; if (!silent) render();
  if (req.a !== 'state') toast('Đang gửi lên máy chủ… đợi vài giây nha');
  call(req).then(function (res) {
    S.busy = false;
    if (!res.ok) { if (silent) return; toast(res.error); if (S.tq.form && S.tq.form.step === 'review') S.tq.form.step = 'edit'; if (!S.v) { S.creds = null; store('gc-creds', null); } render(); return; }
    var prevReached = S.v && S.v.tq ? S.v.tq.team.reached : null;
    if (res.view && !res.view.tq && S.v && S.v.tq) res.view.tq = S.v.tq; // lớp Thành quả nhóm lỗi tạm thời → giữ số liệu cũ, không mất trang
    S.v = res.view;
    var e = res.last;
    if (e && e.t === 'in') { S.bu = 0; S.link = ''; }
    render();
    if (prevReached !== null && res.view.tq && res.view.tq.team.reached > prevReached && !(e && e.t === 'don' && e.newBadges && e.newBadges.length)) {
      var mm = res.view.tq.team.milestones[res.view.tq.team.reached - 1]; tqConfetti();
      modal('<p class="eyebrow">Cả nhóm cùng ăn mừng 🎉</p><span class="bigemoji flip">🏡</span><h2>' + mm + ' gia đình</h2><p>Anh chị em đã cùng nhau giúp <b>' + mm + ' gia đình</b> an tâm khi làm sạch và bảo quản thực phẩm. Cảm ơn tất cả! 💚</p>');
    }
    if (!e) { if (res.view && res.view.me.pending && !S.pickShown) { S.pickShown = 1; modalPick(res.view.me.pending.o); } return; }
    if (e.t === 'don') { S.tq.form = null; S.tq.delId = null; render(); tqCelebrate(e); return; }
    if (e.t === 'in' && e.o) { S.pickShown = 1; modalPick(e.o); return; }
    if (e.t === 'in' && e.l) modal('<p class="eyebrow">Chữ của ' + (e.bu ? 'hôm qua' : 'hôm nay') + '</p><span class="tile big flip' + (isKey(e.l) ? ' key' : '') + '">' + esc(e.l) + '</span><p>' + (isKey(e.l) ? '<b>Chữ hiếm 🔑!</b> Cả game chỉ có vài chữ này.' : 'Đã bỏ vào túi chữ của bạn.') + '</p>');
    if (e.t === 'pick') modal('<p class="eyebrow">Bạn đã chọn</p><span class="tile big flip' + (isKey(e.l) ? ' key' : '') + '">' + esc(e.l) + '</span><p>Cảm ơn bạn đăng đúng giờ 12:12!</p>');
    if (e.t === 'win') { var w = GC.WORDS.filter(function (x) { return x.id === e.w; })[0]; modal('<p class="eyebrow">Ghép thành công</p><h2>' + esc(w.label) + ' 🎉</h2><p>Quà: <b>' + esc(w.prize) + '</b>. BTC sẽ nhắn bạn để gửi quà.</p>' + (WORD_NOTES[w.id] ? '<p class="small muted">ℹ️ ' + esc(WORD_NOTES[w.id]) + '</p>' : '')); }
  });
}

function hint(v) {
  var best = null;
  v.words.forEach(function (w) {
    if (v.me.wins.indexOf(w.id) > -1 || w.done >= w.n) return;
    var miss = w.cells.filter(function (c) { return c.s === 'miss'; }).map(function (c) { return c.c; });
    if (!best || miss.length < best.miss.length) best = { w: w, miss: miss };
  });
  if (!best) return 'Bạn đã ghép hết các từ còn suất. Giỏi quá! 💚';
  if (!best.miss.length) return 'Bạn đã đủ chữ để ghép <b>' + esc(best.w.label) + '</b> — vào Túi chữ bấm Ghép!';
  return 'Còn thiếu <b>' + best.miss.map(esc).join(', ') + '</b> để ghép <b>' + esc(best.w.label) + '</b>.';
}

// Cụm "ai sắp ghép được": chỉ đếm số người (không lộ tên) để tạo cảm giác cùng chơi, mong đợi
function progressLines(v) {
  function rng(lo, hi, len) { return (lo === hi ? lo : lo + '–' + hi) + '/' + len; }
  return (v.progress || []).map(function (w) {
    var bits = [];
    if (w.ready) bits.push('🎯 <b>' + w.ready + ' người đã đủ chữ</b>, sắp ghép');
    if (w.c75) bits.push('🔥 <b>' + w.c75 + ' người</b> có ' + rng(w.t75, w.len - 1, w.len) + ' chữ (75%)');
    if (w.c50) bits.push('🔸 <b>' + w.c50 + ' người</b> có ' + rng(w.t50, w.t75 - 1, w.len) + ' chữ (50%)');
    return bits.length ? '<li><span><b>' + esc(w.label) + '</b> (còn ' + w.left + ' suất): ' + bits.join(' · ') + '</span></li>' : '';
  }).join('');
}
function feedCard(v) {

/* ---------- Tab "Thành quả nhóm" (lớp riêng, không đụng luật game) ---------- */
S.tq = { form: null, delId: null };

function tqParts(o) {

    tabs.hidden = false; out.hidden = false;
    var needPick = !!S.v.me.pending;
    app.innerHTML = (needPick && S.tab !== 'today' ? '<div class="pendbar"><span>🎁 Bạn chưa chọn chữ hôm nay!</span><button data-tab="today">Chọn ngay</button></div>' : '') + (S.tab === 'tq' ? '' : bagStrip(S.v)) + (S.tab === 'bag' ? viewBag(S.v) : S.tab === 'team' ? viewTeam(S.v) : S.tab === 'tq' ? viewTQ(S.v) : S.tab === 'rules' ? viewRules() : viewToday(S.v));
    tabs.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'); b.classList.toggle('alert', needPick && b.dataset.tab === 'today'); });
  }
}

document.addEventListener('click', function (ev) {
  var t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; store('gc-tab', S.tab); render(); window.scrollTo(0, 0); if (S.tab === 'tq' && S.creds && S.v) send({ a: 'state' }, true); return; }
  if (t.id === 'logout') { S.creds = null; S.v = null; store('gc-creds', null); render(); return; }
  if (t.id === 'dNext') { Demo.nextDay(); if (S.creds) send({ a: 'state' }); else render(); return; }
  if (t.id === 'dReset') { Demo.reset(); if (S.creds) send({ a: 'state' }); else render(); return; }
  if (t.id === 'checkin') {
    var link = document.getElementById('link').value.trim();
    S.link = link;
    if (!ENDPOINT && !link) link = 'https://www.facebook.com/share/v/ban-thu/';
    send({ a: 'checkin', link: link, bu: S.bu ? 1 : 0 }); return;
  }
  if (t.classList.contains('dayopt')) { var li = document.getElementById('link'); S.link = li ? li.value : ''; S.bu = +t.dataset.bu; render(); return; }
  if (t.classList.contains('pick')) { send({ a: 'pick', l: t.dataset.l }); return; }
  if (t.classList.contains('ghep')) { send({ a: 'ghep', w: t.dataset.w }); return; }
  if (t.id === 'tqOpen') { S.tq.form = tqNewForm(S.v); S.tq.delId = null; render(); var fe = document.querySelector('.tqform'); if (fe) fe.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.classList.contains('tqedit')) { var eo = S.v.tq.me.orders.filter(function (x) { return x.id === t.dataset.id; })[0]; if (eo) { S.tq.form = tqNewForm(S.v, eo); S.tq.delId = null; render(); var fe2 = document.querySelector('.tqform'); if (fe2) fe2.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
  if (t.id === 'tqCancel') { S.tq.form = null; render(); return; }
  if (t.id === 'tqBack') { S.tq.form.step = 'edit'; render(); return; }
  if (t.id === 'tqReview') { var tf = S.tq.form; if (!tf.ngay) { toast('Chọn ngày bán nha.'); return; } if (!(+tf.h100 || 0) && !(+tf.h20 || 0)) { toast('Đơn cần ít nhất 1 hộp (100g hoặc 20g).'); return; } tf.step = 'review'; render(); var fe3 = document.querySelector('.tqform'); if (fe3) fe3.scrollIntoView({ block: 'start' }); return; }
  if (t.id === 'tqSubmit') { var sf = S.tq.form; send({ a: sf.mode === 'edit' ? 'sua_don' : 'ghi_don', id: sf.id, ngay: sf.ngay, h100: sf.h100 || '0', h20: sf.h20 || '0', tang20: sf.tang20 || '0', ds: sf.ds || '0', mdon: sf.mdon, rid: sf.rid }); return; }
  if (t.classList.contains('tqdel')) { S.tq.delId = t.dataset.id; render(); return; }
  if (t.classList.contains('tqdelno')) { S.tq.delId = null; render(); return; }
  if (t.classList.contains('tqdelok')) { var did = S.tq.delId; S.tq.delId = null; send({ a: 'huy_don', id: did }); return; }
  if (t.id === 'tqRefresh') { send({ a: 'state' }, true); return; }
});
document.addEventListener('submit', function (ev) {
  if (ev.target.id !== 'login') return;
  ev.preventDefault();
  S.creds = { ma: document.getElementById('ma').value.trim().toUpperCase(), pin: document.getElementById('pin').value.trim() };
  S.lastMa = S.creds.ma;
  store('gc-creds', S.creds); send({ a: 'state' });
});

S.tab = store('gc-tab') || 'today';
S.creds = store('gc-creds');
if (S.creds) send({ a: 'state' }); else render();
</script>
</body>
