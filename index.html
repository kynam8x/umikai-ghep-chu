<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ghép chữ Đại sứ Umikai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  /* Bảng màu lấy từ logo Siêu Thị Vietwise: cam bàn tay, xám "phúc lộc của con" */
  :root {
    --or: #F26A21; --or-deep: #C94E14; --or-soft: #FDE6D8; --or-wash: #FFF4EC;
    --grey: #6D6E71; --ink: #2B2420; --paper: #FFFAF6; --line: #F0DDD0;
    --gold: #F4B63A; --gold-deep: #B7801A; --gold-soft: #FFF1CF;
    --white: #FFFFFF;
    --r: 14px;
    --display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
    --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [hidden] { display: none !important; } /* trang đăng độc lập (GitHub Pages, Apps Script) không có sẵn quy tắc này như Artifact */
  html, body { background: var(--paper); color: var(--ink); margin: 0; }
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: var(--body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 96px; }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
  h2 { font-size: 22px; } h3 { font-size: 17px; }
  p { margin: 0; }
  .muted { color: var(--grey); }
  .small { font-size: 13px; }
  .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--or-deep); }

  header.top { display: flex; align-items: center; gap: 12px; padding-block: 14px 4px; }
  header.top img { height: 40px; width: auto; }
  header.top .t { display: flex; flex-direction: column; }
  header.top .t b { font-family: var(--display); font-size: 20px; line-height: 1; color: var(--ink); }
  header.top .t span { font-size: 12px; color: var(--grey); }
  header.top button { margin-left: auto; }

  .card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .hero { background: var(--or); color: var(--white); border: 0; }
  .hero .eyebrow { color: #FFE2CF; }
  .hero .muted { color: #FFE2CF; }

  /* Ô chữ kiểu quân cờ chữ */
  .tiles { display: flex; flex-wrap: wrap; gap: 6px; }
  .tile { --s: 40px; width: var(--s); height: var(--s); border-radius: 9px; display: grid; place-items: center; position: relative;
    font-family: var(--display); font-weight: 800; font-size: calc(var(--s) * .55); line-height: 1;
    background: var(--or); color: var(--white); box-shadow: 0 3px 0 var(--or-deep); }
  .tile.key { background: var(--gold); color: var(--ink); box-shadow: 0 3px 0 var(--gold-deep); }
  .tile.key::after { content: "🔑"; position: absolute; top: -7px; right: -6px; font-size: 12px; }
  .tile.star { background: var(--gold-soft); color: var(--gold-deep); box-shadow: 0 3px 0 var(--gold); }
  .tile.miss { background: transparent; color: #D9C4B6; box-shadow: none; border: 2px dashed #E6CFC0; }
  .tile.miss.key { border-color: var(--gold); color: #E4C27C; }
  .tile.miss.key::after { opacity: .5; }
  .tile .n { position: absolute; bottom: -6px; right: -6px; background: var(--ink); color: var(--white); font-family: var(--body);
    font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding-inline: 4px; }
  .tile.big { --s: 88px; border-radius: 16px; box-shadow: 0 5px 0 var(--or-deep); }
  .tile.big.key { box-shadow: 0 5px 0 var(--gold-deep); }
  .hero .tile { background: var(--white); color: var(--or); box-shadow: 0 5px 0 #F7B48E; }
  .hero .tile.key { background: var(--gold); color: var(--ink); box-shadow: 0 5px 0 var(--gold-deep); }

  button, .btn { font: 600 15px var(--body); border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; background: var(--or); color: var(--white); }
  button:disabled { background: #E9D9CE; color: #A08E82; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--or-deep); border: 1.5px solid var(--line); padding: 8px 12px; font-size: 13px; }
  .hero button { background: var(--white); color: var(--or-deep); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  input, select { font: 15px var(--body); padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--white); color: var(--ink); width: 100%; box-sizing: border-box; }
  label { font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
  label.check { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; }
  label.check input { width: auto; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 160px; }

  .dots { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; }
  .dot { aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.28); }
  .dot.on { background: var(--white); }
  .dot.today { outline: 2px solid var(--gold); outline-offset: 1px; }

  .word { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; padding-block: 14px; border-top: 1px solid var(--line); }
  .word:first-of-type { border-top: 0; padding-top: 0; }
  .word .meta { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--grey); flex-wrap: wrap; }
  .word .lv { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--ink); }
  .word .tile { --s: 32px; }
  .pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--or-soft); color: var(--or-deep); white-space: nowrap; }
  .pill.gold { background: var(--gold-soft); color: var(--gold-deep); }
  .pill.done { background: #E8E5E3; color: var(--grey); }

  .board { display: flex; flex-wrap: wrap; gap: 10px 14px; justify-content: center; }
  .board .w { display: flex; gap: 4px; }
  .board .tile { --s: 30px; }
  .bar { height: 12px; border-radius: 6px; background: var(--or-soft); position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--or); }
  .ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--grey); font-variant-numeric: tabular-nums; }

  .feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .feed li { display: flex; gap: 10px; }
  .feed time { color: var(--grey); font-size: 12px; min-width: 42px; font-variant-numeric: tabular-nums; padding-top: 2px; }

  ol.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
  ol.rules b { color: var(--or-deep); }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--white); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
  nav.tabs button { background: transparent; color: var(--grey); border-radius: 0; padding: 10px 4px 12px; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav.tabs button b { font-size: 20px; line-height: 1; }
  nav.tabs button[aria-current="page"] { color: var(--or-deep); box-shadow: inset 0 3px 0 var(--or); }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); max-width: 528px; margin: 0 auto;
    background: var(--ink); color: var(--white); padding: 12px 16px; border-radius: 12px; font-size: 14px; z-index: 9; }
  .modal { position: fixed; inset: 0; background: rgba(43,36,32,.55); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .modal .card { max-width: 380px; width: 100%; align-items: center; text-align: center; }
  .flip { animation: flip .7s cubic-bezier(.2,.8,.3,1.2); }
  @keyframes flip { from { transform: rotateY(90deg) scale(.6); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .flip { animation: none; } }
  .demo { background: var(--gold-soft); color: var(--gold-deep); border-radius: 12px; padding: 10px 12px; font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
</style>
</head>

<script>
/* Game "Ghép chữ Đại sứ Umikai 2026" — lõi luật chơi.

 */
var GC = (function () {
  var CFG = {
    start: '2026-10-01',        // ngày đầu được check-in (Nam chốt 30/09: game tính từ 01/10; bài 25–30/09 để dành phương án đổi chữ cuối chương trình)
    end: '2026-10-30',          // ngày cuối được check-in (V30)
    strictFrom: '2026-10-01',   // từ ngày này: chỉ check-in sau 12:12, check-in 12:12–13:12 = "đúng giờ" (chọn 1 trong 2 chữ)
    releaseEnd: '2026-10-25',   // chữ hiếm 🔑 được thả dần tới ngày này
    ghepEnd: '2026-11-01',      // hạn cuối ghép chữ / tặng chữ
    onTimeFrom: 12 * 60 + 12,
    onTimeTo: 13 * 60 + 12,
    maxPrize: 2,                // mỗi người nhận tối đa 2 phần quà → quà đến tay nhiều người hơn
    milestones: [300, 700, 1010], // tổng lượt check-in cả nhóm → mỗi mốc ai đã chơi được 1 chữ vàng ★
    slogan: 'SẠCH TỪ HÔM NAY KHỎE CHO NGÀY MAI',
    teamPrize: '2 hộp Umikai 100g + mọi suất chưa ai ghép tới 01/11 — quay số cho mọi người đã check-in (mỗi ngày check-in = 1 phiếu)'
  };

  // 12 từ cá nhân (Nam chốt 28/09), dễ → khó. `open` = ngày bắt đầu được ghép (Nam chốt 30/09: mở kho theo tuần để quà còn tới cuối tháng). Quà cá nhân = 20×20g + 8×100g; 2×100g còn lại là quà chung câu slogan.
  var WORDS = [
    { id: 'GION', open: '2026-10-01', label: 'GIÒN', n: 4, prize: '1 hộp Umikai 20g' },
    { id: 'NGON', open: '2026-10-01', label: 'NGON', n: 4, prize: '1 hộp Umikai 20g' },
    { id: 'STVW', open: '2026-10-08', label: 'STVW', n: 3, prize: '1 hộp Umikai 20g' },
    { id: 'PH12', open: '2026-10-08', label: 'pH 12', n: 3, prize: '1 hộp Umikai 20g' },
    { id: 'DAISU', open: '2026-10-08', label: 'ĐẠI SỨ', n: 3, prize: '1 hộp Umikai 20g' },
    { id: 'RUARAU', open: '2026-10-08', label: 'RỬA RAU', n: 3, prize: '1 hộp Umikai 20g' },
    { id: 'UMIKAI', open: '2026-10-15', label: 'UMIKAI', n: 2, prize: '1 hộp Umikai 100g' },
    { id: 'IONCANXI', open: '2026-10-15', label: 'ION CANXI', n: 1, prize: '1 hộp Umikai 100g' },
    { id: 'BOCCANXI', open: '2026-10-15', label: 'BỌC CANXI', n: 1, prize: '1 hộp Umikai 100g' },
    { id: 'KORUALAI', open: '2026-10-22', label: 'KO RỬA LẠI', n: 1, prize: '1 hộp Umikai 100g' },
    { id: 'BAOQUANTP', open: '2026-10-22', label: 'BẢO QUẢN TP', n: 1, prize: '1 hộp Umikai 100g' },
    { id: 'SONGCOHIEU', open: '2026-10-22', label: 'SỐNG CÓ HIẾU', n: 1, prize: '2 hộp Umikai 100g' }
  ];
  // Chữ hiếm 🔑: kho mỗi chữ = tổng (số suất × số lần xuất hiện) của các từ chứa nó → luôn đủ chữ cho mọi suất, không thừa nhiều.
  var SCARCE = ['G', 'W', '1', 'D', 'M', 'X', 'L', 'Q', 'E']; // R để chữ thường: RỬA RAU cần 2 R, để hiếm thì mô phỏng gần như không ai ghép được
  var KEY_WEIGHT = 1.5; // trọng số mỗi chữ hiếm đang chờ phát
  var PAIR_BOOST = 4;   // từ cần 2 chữ hiếm: ai đang giữ 1 chữ thì dễ ra chữ còn lại hơn (chữ hiếm "đi theo cặp")
  var STAR = '★';

  var KEYS = {}, COMMON = {};
  SCARCE.forEach(function (c) { KEYS[c] = true; });
  WORDS.forEach(function (w) {
    w.keys = w.id.split('').filter(function (c, i, a) { return KEYS[c] && a.indexOf(c) === i; });
    w.id.split('').forEach(function (c) { if (!KEYS[c]) COMMON[c] = (COMMON[c] || 1) + 1; });
  });
  function isKey(c) { return !!KEYS[c]; }
  // PAIRS[x] = các chữ hiếm cùng nằm trong 1 từ cần ≥2 ô chữ hiếm với x (hiện chỉ SONGCOHIEU: G↔E)
  var PAIRS = {};
  WORDS.forEach(function (w) {
    var slots = w.id.split('').filter(isKey);
    if (slots.length < 2) return;
    slots.forEach(function (x, i) { slots.forEach(function (y, j) { if (i !== j) { PAIRS[x] = PAIRS[x] || {}; PAIRS[x][y] = true; } }); });
  });
  function occ(w, c) { return w.id.split(c).length - 1; }

  function vnDay(now) { return new Date(now.getTime() + 7 * 3600e3).toISOString().slice(0, 10); }
  function vnMinutes(now) { var d = new Date(now.getTime() + 7 * 3600e3); return d.getUTCHours() * 60 + d.getUTCMinutes(); }

    var span = dayIdx(CFG.releaseEnd) - dayIdx(CFG.start), cnt = 0;
    for (var i = 1; i <= w.n; i++) if (dayIdx(day) >= dayIdx(CFG.start) + Math.round(i / (w.n + 1) * span)) cnt++;
    return cnt;
  }
  // Số chữ hiếm c đã được thả tới ngày `day`
  function releasedLetter(c, day) {
    return WORDS.reduce(function (s, w) { return s + released(w, day) * occ(w, c); }, 0);
  }

  function player(st, ma) {
    if (!st.p[ma]) st.p[ma] = { ma: ma, name: (st.names[ma] || ma), bag: {}, days: {}, dayLink: {}, wins: [], gave: {}, starUsed: 0, pending: null };
    return st.p[ma];
  }
  function add(p, l) { p.bag[l] = (p.bag[l] || 0) + 1; }
  function take(p, l) { if ((p.bag[l] || 0) > 0) { p.bag[l]--; if (!p.bag[l]) delete p.bag[l]; return true; } return false; }
  function feed(st, e, text) { st.feed.push({ at: e.at, text: text }); }

  // Chuẩn hoá link Facebook để nhận ra cùng 1 bài dù dán kiểu khác nhau (bỏ ?mibextid…, bỏ / cuối, lấy id reel/video/post).
  // Link rút gọn /share/… mỗi lần bấm "Chia sẻ" có thể ra mã khác nhau nên chỉ chặn được khi dán y nguyên mã đó.
  function normLink(u) {
    var s = String(u || '').trim().replace(/^https?:\/\//i, '');
    var host = s.split(/[\/?#]/)[0].toLowerCase().replace(/^(www|m|web|mbasic)\./, '');
    var rest = s.slice(s.split(/[\/?#]/)[0].length);
    var q = function (k) { var m = rest.match(new RegExp('[?&]' + k + '=([^&#]+)')); return m && m[1]; };
    var m;
    if (host === 'fb.watch') return 'fbw:' + rest.replace(/[?#].*$/, '').replace(/\/+$/, '').replace(/^\//, '');
    if ((m = rest.match(/\/reels?\/(\d+)/))) return 'reel:' + m[1];
    if ((m = rest.match(/\/videos\/(?:[^\/]+\/)?(\d+)/))) return 'video:' + m[1];
    if (q('v')) return 'video:' + q('v');
    if (q('story_fbid')) return 'post:' + q('story_fbid');
    if (q('fbid')) return 'post:' + q('fbid');
    if ((m = rest.match(/\/posts\/([\w-]+)/))) return 'post:' + m[1];
    if ((m = rest.match(/\/share\/(?:[a-z]\/)?([\w-]+)/))) return 'share:' + m[1];
    return host + rest.replace(/[?#].*$/, '').replace(/\/+$/, '');
  }

  function build(events, players) {
    var st = { p: {}, names: {}, total: 0, issued: {}, pendingKeys: {}, done: {}, feed: [], links: {} };
    (players || []).forEach(function (x) { st.names[x.ma] = x.name; });
    (players || []).forEach(function (x) { player(st, x.ma); });
    WORDS.forEach(function (w) { st.done[w.id] = 0; });
    SCARCE.forEach(function (c) { st.issued[c] = 0; st.pendingKeys[c] = 0; });
    var issue = function (l, k) { if (KEYS[l]) st.issued[l] += k; };
    var pend = function (opts, k) { opts.forEach(function (l) { if (KEYS[l]) st.pendingKeys[l] += k; }); };
    var reached = 0;
    events.forEach(function (e) {
      var p = player(st, e.ma);
      if (e.t === 'in') {
        if (p.days[e.d]) return;
        p.days[e.d] = e.l || 'pending'; st.total++;
        if (e.link) { var lk = normLink(e.link); p.dayLink[e.d] = lk; if (!st.links[lk]) st.links[lk] = { ma: e.ma, d: e.d }; }
        if (e.l) { add(p, e.l); issue(e.l, 1); } else { p.pending = { d: e.d, o: e.o }; pend(e.o, 1); }
      } else if (e.t === 'pick') {
        if (!p.pending) return;
        pend(p.pending.o, -1); add(p, e.l); issue(e.l, 1); p.days[p.pending.d] = e.l; p.pending = null;
      } else if (e.t === 'give') {
        var q = player(st, e.to);
        if (take(p, e.l)) { add(q, e.l); p.gave[e.d] = 1; feed(st, e, p.name + ' tặng ' + q.name + ' chữ ' + e.l + ' 💚'); }
      } else if (e.t === 'win') {
        var w = WORDS.filter(function (x) { return x.id === e.w; })[0];
        w.id.split('').forEach(function (c) { if (!take(p, c)) p.starUsed++; });
        p.wins.push(w.id); st.done[w.id]++;

      } else if (e.t === 'rev') {
        var l = p.days[e.d];
        if (l) { delete p.days[e.d]; st.total--; if (l !== 'pending' && take(p, l)) issue(l, -1); }
        if (p.pending && p.pending.d === e.d) { pend(p.pending.o, -1); p.pending = null; }
        var rk = p.dayLink[e.d];
        if (rk && st.links[rk] && st.links[rk].ma === e.ma && st.links[rk].d === e.d) delete st.links[rk];
        delete p.dayLink[e.d];
      }
      while (reached < CFG.milestones.length && st.total >= CFG.milestones[reached]) {
        reached++; feed(st, e, 'Cả nhóm chạm mốc ' + CFG.milestones[reached - 1] + ' lượt check-in — mỗi người được 1 chữ vàng ★');
      }
    });
    st.reached = reached;
    Object.keys(st.p).forEach(function (ma) {
      var p = st.p[ma];
      p.stars = Object.keys(p.days).length ? reached - p.starUsed : 0;
    });

  }

  function draw(st, day, rng, exclude, me) {
    var pool = [];
    Object.keys(COMMON).forEach(function (c) { if (c !== exclude) pool.push([c, COMMON[c]]); });
    SCARCE.forEach(function (c) {
      var avail = releasedLetter(c, day) - st.issued[c] - st.pendingKeys[c];
      var boost = me && Object.keys(me.bag).some(function (x) { return PAIRS[x] && PAIRS[x][c]; }) ? PAIR_BOOST : 1;
      if (avail > 0 && c !== exclude) pool.push([c, KEY_WEIGHT * avail * boost]);
    });
    var sum = pool.reduce(function (s, x) { return s + x[1]; }, 0), r = rng() * sum;
    for (var i = 0; i < pool.length; i++) { r -= pool[i][1]; if (r <= 0) return pool[i][0]; }
    return pool[pool.length - 1][0];
  }

  // Tô sáng từng ô của 1 từ theo túi chữ hiện có (chữ hiếm phải đúng chữ; chữ thường có thể thay bằng ★)
  function plan(p, w) {
    var bag = {}, stars = p.stars; Object.keys(p.bag).forEach(function (k) { bag[k] = p.bag[k]; });
    var cells = w.id.split('').map(function (c) {
      if ((bag[c] || 0) > 0) { bag[c]--; return { c: c, s: 'have' }; }
      if (!KEYS[c] && stars > 0) { stars--; return { c: c, s: 'star' }; }
      return { c: c, s: 'miss' };

    return { cells: cells, ok: cells.every(function (x) { return x.s !== 'miss'; }) };
  }

  function err(msg) { return { res: { ok: false, error: msg }, events: [] }; }

  // Xử lý 1 yêu cầu. Trả { res, events } — events là các sự kiện mới cần ghi nối vào nhật ký.
  function act(req, events, players, now, rng) {
    var who = (players || []).filter(function (x) { return x.ma === String(req.ma || '').trim().toUpperCase(); })[0];
    if (who && !String(who.pin || '').trim()) return err('Tài khoản của bạn chưa có PIN. Nhắn BTC (Kỳ Nam) để được cấp.');
    if (!who || String(who.pin) !== String(req.pin || '').trim()) return err('Mã đại sứ hoặc mã PIN chưa đúng. PIN là 4 số cuối SĐT bạn đăng ký.');
    var st = build(events, players), p = st.p[who.ma], today = vnDay(now), at = now.toISOString(), out = [];
    var push = function (e) { e.at = at; e.ma = e.ma || who.ma; out.push(e); events = events.concat([e]); };

    if (p.pending && p.pending.d !== today && req.a !== 'pick') {
      push({ t: 'pick', l: p.pending.o[0] }); st = build(events, players); p = st.p[who.ma];
    }

    if (req.a === 'checkin') {
      var day = req.bu ? addDays(today, -1) : today;
      if (day < CFG.start) return err('Game bắt đầu từ ' + CFG.start.split('-').reverse().join('/') + '.');
      if (day > CFG.end) return err('Đã hết ngày check-in (30/10). Bạn vẫn ghép và tặng chữ được tới 01/11.');
      if (p.days[day]) return err(req.bu ? 'Hôm qua bạn đã check-in rồi.' : 'Hôm nay bạn đã check-in rồi. Hẹn bạn 12:12 ngày mai!');
      if (!/(facebook\.com|fb\.watch|fb\.com)\//i.test(String(req.link || ''))) return err('Dán link bài Facebook hôm nay của bạn (bắt đầu bằng https://www.facebook.com/…).');
      var owner = st.links[normLink(req.link)];
      if (owner) return err(owner.ma === who.ma ? 'Link này bạn đổi chữ rồi nè 😄 Hôm nay dán link bài mới của bạn nha.' : 'Link này có chủ rồi nè 😄 Bạn dán link bài hôm nay của chính mình nha.');
      var strict = day >= CFG.strictFrom, mins = vnMinutes(now);
      if (!req.bu && strict && mins < CFG.onTimeFrom) return err('Video đăng lúc 12:12 — check-in sau khi đăng nhé.');
      var link = String(req.link).slice(0, 300);
      if (!req.bu && strict && mins <= CFG.onTimeTo) {
        var a = draw(st, day, rng, null, p), b = draw(st, day, rng, a, p);
        push({ t: 'in', d: day, o: [a, b], link: link });
      } else {
        push({ t: 'in', d: day, l: draw(st, day, rng, null, p), link: link, bu: req.bu ? 1 : 0 });
      }
    } else if (req.a === 'pick') {
      if (!p.pending || p.pending.o.indexOf(req.l) < 0) return err('Không có chữ để chọn.');
      push({ t: 'pick', l: req.l });
    } else if (req.a === 'give') {
      var to = (players || []).filter(function (x) { return x.ma === req.to; })[0];
      if (!to || to.ma === who.ma) return err('Chọn một đồng đội để tặng.');
      if (today > CFG.ghepEnd) return err('Game đã kết thúc.');
      if (p.gave[today]) return err('Mỗi ngày tặng được 1 chữ. Mai tặng tiếp nhé!');
      if (!(p.bag[req.l] > 0)) return err('Bạn không có chữ ' + req.l + '.');
      if (KEYS[req.l]) return err('Chữ hiếm 🔑 giữ lại để tự ghép nha, chỉ tặng được chữ thường thôi 😄');
      push({ t: 'give', to: to.ma, l: req.l, d: today });
    } else if (req.a === 'ghep') {
      var w = WORDS.filter(function (x) { return x.id === req.w; })[0];
      if (!w) return err('Không có từ này.');
      if (today > CFG.ghepEnd) return err('Game đã kết thúc.');
      if (p.wins.indexOf(w.id) > -1) return err('Bạn đã ghép từ này rồi.');
      if (p.wins.length >= CFG.maxPrize) return err('Bạn đã nhận đủ ' + CFG.maxPrize + ' phần quà. Hãy tặng chữ cho đồng đội nhé 💚');
      if (today < w.open) return err(w.label + ' mở ghép từ ' + w.open.slice(8) + '/' + w.open.slice(5, 7) + ' nha 😄 Giữ chữ lại tới hôm đó.');
      if (st.done[w.id] >= w.n) return err('Từ này đã hết suất quà.');
      if (!plan(p, w).ok) return err('Chưa đủ chữ để ghép ' + w.label + '.');
      push({ t: 'win', w: w.id });
    } else if (req.a !== 'state') {
      return err('Yêu cầu không hợp lệ.');
    }
    st = build(events, players);
    return { res: { ok: true, view: view(st, who.ma, now), last: out[out.length - 1] || null }, events: out };
  }

  // Dữ liệu trang cần hiển thị cho 1 người (không lộ PIN, không lộ link của người khác)

})();

/* ---------- Bản thử: máy chủ giả lưu trong trình duyệt (khi chưa có ENDPOINT) ---------- */

    if (e.t === 'pick') modal('<p class="eyebrow">Bạn đã chọn</p><span class="tile big flip' + (isKey(e.l) ? ' key' : '') + '">' + esc(e.l) + '</span><p>Cảm ơn bạn đăng đúng giờ 12:12!</p>');
    if (e.t === 'give') toast('Đã tặng chữ ' + e.l + ' 💚');
    if (e.t === 'win') { var w = GC.WORDS.filter(function (x) { return x.id === e.w; })[0]; modal('<p class="eyebrow">Ghép thành công</p><h2>' + esc(w.label) + ' 🎉</h2><p>Quà: <b>' + esc(w.prize) + '</b>. BTC sẽ nhắn bạn để gửi quà.</p>' + (WORD_NOTES[w.id] ? '<p class="small muted">ℹ️ ' + esc(WORD_NOTES[w.id]) + '</p>' : '')); }
  });
}

/* ---------- Các màn ---------- */
function viewLogin() {
  return '<section class="card hero"><p class="eyebrow">Mỗi ngày đăng video · nhận 1 chữ</p><h2>Ghép đủ chữ, nhận quà Umikai</h2>' +
    '<p class="muted">12 từ từ dễ đến khó: GIÒN, NGON, STVW, pH 12, ĐẠI SỨ, RỬA RAU, UMIKAI, ION CANXI, BỌC CANXI, KO RỬA LẠI, BẢO QUẢN TP, SỐNG CÓ HIẾU. Cả nhóm cùng thắp sáng câu "Sạch từ hôm nay".</p></section>' +
    '<form class="card" id="login"><h3>Vào game</h3>' +
    '<label for="ma">Mã đại sứ<input id="ma" autocomplete="username" placeholder="UMK-XXXX" required></label>' +
    '<label for="pin">Mã PIN (4 số cuối SĐT đăng ký)<input id="pin" inputmode="numeric" maxlength="4" autocomplete="current-password" required></label>' +
    '<button type="submit">Vào game</button>' +
    (ENDPOINT ? '' : '<p class="small muted">Bản thử: mã <b>UMK-DEMO</b>, PIN <b>0000</b> (đã điền sẵn).</p>') + '</form>';
}

function hint(v) {
  var best = null;
  v.words.forEach(function (w) {
    if (v.me.wins.indexOf(w.id) > -1 || w.done >= w.n) return;
    var miss = w.cells.filter(function (c) { return c.s === 'miss'; }).map(function (c) { return c.c; });
    if (!best || miss.length < best.miss.length) best = { w: w, miss: miss };
  });
  if (!best) return 'Bạn đã ghép hết các từ còn suất. Tặng chữ giúp đồng đội nhé 💚';
  if (!best.miss.length) return 'Bạn đã đủ chữ để ghép <b>' + esc(best.w.label) + '</b> — vào Túi chữ bấm Ghép!';
  return 'Còn thiếu <b>' + best.miss.map(esc).join(', ') + '</b> để ghép <b>' + esc(best.w.label) + '</b>.';
}

function viewToday(v) {
  var days = [], d = v.cfg.start, idx = 0, cur = 0;
  while (d <= v.cfg.end) { idx++; if (d === v.today) cur = idx; days.push('<span class="dot' + (v.me.days.indexOf(d) > -1 ? ' on' : '') + (d === v.today ? ' today' : '') + '" title="' + dmy(d) + '"></span>'); d = GC.addDays(d, 1); }
  var dayLabel = cur ? 'Ngày ' + cur + ' / ' + v.cfg.totalDays : (v.today < v.cfg.start ? 'Game chưa bắt đầu' : 'Đã hết ngày check-in');
  var body;
  if (v.me.pending) {
    body = '<p class="eyebrow">Đăng đúng giờ · chọn 1 chữ</p><div class="row">' + v.me.pending.o.map(function (c) {
      return '<button class="pick" data-l="' + esc(c) + '" aria-label="Chọn chữ ' + esc(c) + '" style="padding:0;background:transparent">' + tile(c, 'big') + '</button>'; }).join('') + '</div>';
  } else if (v.checkedToday) {
    body = '<p class="eyebrow">Đã check-in hôm nay</p><p>Chữ hôm nay đã vào túi. Hẹn bạn <b>12:12</b> ngày mai!</p>';
  } else {
    var canBu = !v.checkedYesterday && GC.addDays(v.today, -1) >= v.cfg.start && GC.addDays(v.today, -1) <= v.cfg.end;
    body = '<p class="eyebrow">Đăng video xong · check-in nhận chữ</p>' +
      '<label for="link">Link bài Facebook hôm nay<input id="link" type="url" placeholder="https://www.facebook.com/…" autocomplete="off"></label>' +
      (canBu ? '<label class="check" for="bu"><input type="checkbox" id="bu"> Hôm qua mình quên check-in (check-in bù)</label>' : '') +
      '<button id="checkin"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Đang gửi… đợi vài giây nha' : 'Check-in nhận chữ') + '</button>' +
      '<p class="small">' + LINK_HINT + '</p>' +
      '<p class="small muted">Từ 01/10: check-in 12:12 – 13:12 được chọn 1 trong 2 chữ.</p>';
  }
  return '<section class="card hero"><div class="row" style="justify-content:space-between"><h2>Chào ' + esc(v.me.name) + '</h2><span class="pill">' + dayLabel + '</span></div>' +
    '<div class="dots">' + days.join('') + '</div>' + body + '</section>' +
    '<section class="card"><p class="eyebrow">Gần nhất</p><p>' + hint(v) + '</p></section>' + feedCard(v);
}

function viewBag(v) {
  var bag = Object.keys(v.me.bag).sort();
  var bagHtml = bag.length ? bag.map(function (c) { return tile(c, '', v.me.bag[c]); }).join('') : '<p class="muted">Túi đang trống — check-in để nhận chữ đầu tiên.</p>';
  if (v.me.stars > 0) bagHtml += tile('★', 'star', v.me.stars);
  var words = v.words.map(function (w, i) {
    var won = v.me.wins.indexOf(w.id) > -1, left = w.n - w.done;
    var status = won ? '<span class="pill done">Bạn đã ghép</span>' : left <= 0 ? '<span class="pill done">Hết suất</span>' : '<span class="pill' + (/100g/.test(w.prize) ? ' gold' : '') + '">còn ' + left + '/' + w.n + ' suất</span>';
    var full = v.me.wins.length >= v.cfg.maxPrize;
    var can = w.ok && !won && left > 0 && !full && w.isOpen && !S.busy;
    if (!won && left > 0 && !w.isOpen) status = '<span class="pill">Mở ghép từ ' + dmy(w.open) + '</span>';
    if (w.ok && !won && left > 0 && full) status = '<span class="pill done">Bạn đã đủ ' + v.cfg.maxPrize + ' quà — tặng chữ cho bạn nhé 💚</span>';
    return '<div class="word"><div class="tiles">' + w.cells.map(function (c) { return tile(c.s === 'star' ? '★' : c.c, c.s === 'have' ? '' : c.s, 0); }).join('') + '</div>' +
      '<button class="ghep" data-w="' + w.id + '"' + (can ? '' : ' disabled') + '>Ghép</button>' +
      '<div class="meta"><span><span class="lv">' + (i + 1) + '. ' + esc(w.label) + '</span> · ' + esc(w.prize) + '</span>' + status + '</div>' + wordNote(w.id) + '</div>';
  }).join('');
  var mates = v.mates.map(function (m) { return '<option value="' + esc(m.ma) + '">' + esc(m.name) + '</option>'; }).join('');
  var letters = bag.filter(function (c) { return !isKey(c); }).map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
  return '<section class="card"><div class="row" style="justify-content:space-between"><h3>Túi chữ của bạn</h3><span class="small muted">🔑 = chữ hiếm · ★ = chữ vàng</span></div><div class="tiles">' + bagHtml + '</div></section>' +
    '<section class="card"><h3>12 từ · quà từ nhỏ đến lớn</h3><p class="small muted">Mỗi người nhận tối đa ' + v.cfg.maxPrize + ' phần quà (đã nhận ' + v.me.wins.length + '). ★ thay được mọi chữ trừ chữ hiếm 🔑.</p>' + words + '</section>' +
    '<section class="card"><h3>Tặng chữ cho đồng đội 💚</h3><p class="small muted">Mỗi ngày tặng được 1 chữ. Chữ trùng hay chữ bạn không cần — tặng bạn đang thiếu. Chữ hiếm 🔑 giữ lại để tự ghép, không tặng được.</p>' +
    (bag.length ? '<div class="row"><select id="giveTo" class="grow" aria-label="Tặng cho ai">' + mates + '</select><select id="giveL" aria-label="Chữ muốn tặng" style="width:90px">' + letters + '</select>' +
      '<button id="give"' + (v.me.gaveToday || S.busy ? ' disabled' : '') + '>' + (v.me.gaveToday ? 'Mai tặng tiếp' : 'Tặng') + '</button></div>' : '<p class="muted">Chưa có chữ để tặng.</p>') + '</section>';
}

function viewTeam(v) {
  var goal = v.team.milestones[v.team.milestones.length - 1], total = v.team.total;
  var chars = v.cfg.slogan.replace(/ /g, '').length, lit = Math.min(chars, Math.floor(total / goal * chars)), k = 0;
  var board = v.cfg.slogan.split(' ').map(function (w) {
    return '<span class="w">' + w.split('').map(function (c) { return '<span class="tile' + (k++ < lit ? '' : ' miss') + '">' + esc(c) + '</span>'; }).join('') + '</span>';
  }).join('');
  var ticks = v.team.milestones.map(function (m, i) { return '<span>' + (total >= m ? '✅ ' : '') + m + (i < v.team.milestones.length - 1 ? ' · ★' : ' · ★ + quà chung') + '</span>'; }).join('');
  var given = v.words.reduce(function (s, w) { return s + w.done; }, 0), slots = v.words.reduce(function (s, w) { return s + w.n; }, 0);
  return '<section class="card hero"><p class="eyebrow">Cả nhóm cùng thắp sáng</p><h2>' + total.toLocaleString('vi-VN') + ' lượt check-in</h2>' +
    '<p class="muted">Mỗi lượt check-in của bất kỳ ai cũng thắp thêm bảng chữ. Không ai hơn ai — ai đăng cũng là góp cho cả nhóm.</p></section>' +
    '<section class="card"><div class="board">' + board + '</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + goal + '" aria-valuenow="' + total + '"><i style="width:' + Math.min(100, total / goal * 100) + '%"></i></div>' +
    '<div class="ticks">' + ticks + '</div><p class="small">Mỗi mốc: mọi người đã chơi nhận <b>1 chữ vàng ★</b>. Thắp sáng cả câu: <b>' + esc(v.cfg.teamPrize) + '</b>.</p></section>' +
    '<section class="card"><h3>Quà đã về tay đại sứ</h3><p><b>' + given + '</b> / ' + slots + ' suất quà cá nhân đã được ghép.</p></section>' + feedCard(v);
}

function feedCard(v) {
  if (!v.feed.length) return '';
  return '<section class="card"><h3>Tin cả nhóm</h3><ul class="feed">' + v.feed.map(function (f) {
    var d = new Date(f.at); return '<li><time>' + ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '</time><span>' + esc(f.text) + '</span></li>'; }).join('') + '</ul></section>';
}

function viewRules() {
  var w = GC.WORDS.map(function (x, i) { return '<li><b>' + esc(x.label) + '</b> — ' + esc(x.prize) + ' · ' + x.n + ' suất' + (WORD_NOTES[x.id] ? '<br><span class="small muted">ℹ️ ' + esc(WORD_NOTES[x.id]) + '</span>' : '') + '</li>'; }).join('');
  return '<section class="card"><h2>Luật chơi</h2><ol class="rules">' +
    '<li><b>Mỗi ngày đăng bài/video</b> (01/10 – 30/10) → vào đây dán link bài → nhận <b>1 chữ ngẫu nhiên</b>.</li>' +
    '<li>Từ 01/10, check-in trong <b>12:12 – 13:12</b> được <b>chọn 1 trong 2 chữ</b>. Quên check-in? Hôm sau bấm "check-in bù" cho hôm qua.</li>' +
    '<li>Gom đủ chữ để <b>ghép 1 trong 12 từ</b>. Mỗi từ có ít nhất 1 <b>chữ hiếm 🔑</b> (G, W, 1, D, M, X, L, Q, E) — chữ hiếm chỉ phát đủ cho số suất quà, thả dần tới 25/10.</li>' +
    '<li><b>Kho quà mở theo tuần:</b> GIÒN, NGON mở ngay · từ 08/10 thêm STVW, pH 12, ĐẠI SỨ, RỬA RAU · từ 15/10 thêm UMIKAI, ION CANXI, BỌC CANXI · từ 22/10 thêm KO RỬA LẠI, BẢO QUẢN TP, SỐNG CÓ HIẾU. Quà lớn luôn còn tới tuần cuối!</li>' +
    '<li>Mỗi người nhận tối đa <b>2 phần quà</b>, mỗi từ ghép 1 lần. Đủ quà rồi thì <b>tặng chữ thường</b> cho đồng đội (1 chữ/ngày; chữ hiếm 🔑 không tặng được).</li>' +
    '<li>Cả nhóm đạt <b>300 · 700 · 1.010</b> lượt check-in → mỗi mốc ai đã chơi được <b>1 chữ vàng ★</b> (thay mọi chữ trừ chữ hiếm 🔑).</li>' +
    '<li>Thắp sáng cả câu <b>"Sạch từ hôm nay khỏe cho ngày mai"</b> → quay 2 hộp Umikai 100g cho mọi người đã chơi. Suất nào tới 01/11 chưa ai ghép cũng dồn vào lượt quay này.</li>' +
    '<li><b>Mỗi link bài chỉ đổi được 1 chữ</b> — dán đúng link bài hôm nay của chính bạn là chữ bay về túi liền 😄</li>' +
    '</ol></section><section class="card"><h3>12 từ và quà</h3><ol class="rules">' + w + '</ol><p class="small muted">Hạn ghép và tặng chữ: 01/11. Quà do Umikai tài trợ, BTC Siêu Thị Vietwise gửi.</p></section>';
}

function render() {
  var tabs = document.getElementById('tabs'), out = document.getElementById('logout'), bar = document.getElementById('demoBar');
  bar.hidden = !!ENDPOINT;
  if (!ENDPOINT) bar.innerHTML = '<span>Bản thử · ngày giả lập <b>' + dmy(Demo.day()) + '</b>, 12:30 · 12 đồng đội giả</span><span class="row"><button class="ghost" id="dNext">Sang ngày mới</button><button class="ghost" id="dReset">Làm lại</button></span>';
  if (!S.creds || !S.v) {
    tabs.hidden = true; out.hidden = true; app.innerHTML = viewLogin();
    if (!ENDPOINT) { document.getElementById('ma').value = 'UMK-DEMO'; document.getElementById('pin').value = '0000'; }
    else if (S.lastMa) document.getElementById('ma').value = S.lastMa;
  } else {
    tabs.hidden = false; out.hidden = false;
    app.innerHTML = S.tab === 'bag' ? viewBag(S.v) : S.tab === 'team' ? viewTeam(S.v) : S.tab === 'rules' ? viewRules() : viewToday(S.v);
    tabs.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'); });
  }
}

document.addEventListener('click', function (ev) {
  var t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; store('gc-tab', S.tab); render(); window.scrollTo(0, 0); return; }
  if (t.id === 'logout') { S.creds = null; S.v = null; store('gc-creds', null); render(); return; }
  if (t.id === 'dNext') { Demo.nextDay(); if (S.creds) send({ a: 'state' }); else render(); return; }
  if (t.id === 'dReset') { Demo.reset(); if (S.creds) send({ a: 'state' }); else render(); return; }
  if (t.id === 'checkin') {
    var link = document.getElementById('link').value.trim(), bu = document.getElementById('bu');
    if (!ENDPOINT && !link) link = 'https://www.facebook.com/share/v/ban-thu/';
    send({ a: 'checkin', link: link, bu: bu && bu.checked ? 1 : 0 }); return;
  }
  if (t.classList.contains('pick')) { send({ a: 'pick', l: t.dataset.l }); return; }
  if (t.classList.contains('ghep')) { send({ a: 'ghep', w: t.dataset.w }); return; }
  if (t.id === 'give') { send({ a: 'give', to: document.getElementById('giveTo').value, l: document.getElementById('giveL').value }); return; }
});
document.addEventListener('submit', function (ev) {
  if (ev.target.id !== 'login') return;
  ev.preventDefault();
  S.creds = { ma: document.getElementById('ma').value.trim().toUpperCase(), pin: document.getElementById('pin').value.trim() };
  S.lastMa = S.creds.ma;
  store('gc-creds', S.creds); send({ a: 'state' });
});

S.tab = store('gc-tab') || 'today';
S.creds = store('gc-creds');
if (S.creds) send({ a: 'state' }); else render();
</script>
</body>
</html>
